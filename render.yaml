services:
  - type: web
    name: mplads-ai-backend
    env: python
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        value: "http://localhost:3000,https://mplads-ai-risk-intelligence-123.vercel.app,https://mplads-ai-risk-intelligence.vercel.app"
